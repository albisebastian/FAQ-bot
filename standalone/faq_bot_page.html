<title>ShopEase FAQ Bot</title>
<style>
/* White chat box on a soft page. Text is black. Blue = actions and focus, green = good/connected,
   red = problem/no match. Colour is never the only signal: every state also has a text label. */
:root {
  --page: #f3f5f9;
  --card: #ffffff;
  --fg: #111111;          /* all text */
  --muted: #111111;       /* captions are black too; hierarchy comes from size and weight */
  --placeholder: #6b7280; /* 4.8:1 on white */
  --line: #e6e9f0;
  --line-strong: #cdd5e3;

  --blue: #2563eb;
  --blue-dark: #1d4ed8;
  --blue-soft: #eaf1ff;
  --green: #16a34a;
  --green-soft: #e8f7ee;
  --red: #dc2626;
  --red-soft: #fdecec;

  --radius: 20px;
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; padding: 24px; display: flex; align-items: center; justify-content: center;
  background: var(--page); color: var(--fg);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* ---- the box ---- */
.card {
  width: 100%; max-width: 720px; height: 100%; max-height: 780px; display: flex; flex-direction: column;
  overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 24px rgba(16, 24, 40, 0.06);
  transition: box-shadow 0.3s var(--ease-out), transform 0.3s var(--ease-out), border-color 0.3s ease;
}
.card:hover {   /* small hover effect: lifts 2px, deeper shadow, blue-tinted edge */
  transform: translateY(-2px); border-color: #bcd0f7;
  box-shadow: 0 2px 4px rgba(16, 24, 40, 0.05), 0 16px 40px rgba(37, 99, 235, 0.12);
}

/* ---- header ---- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
.brand { font-weight: 650; letter-spacing: -0.01em; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
.status.ok .dot { background: var(--green); }
.status.ok .dot::after {
  content: ""; position: absolute; inset: -1px; border-radius: 50%; border: 1px solid var(--green);
  animation: pulse 2.6s ease-out infinite;
}
.status.err .dot { background: var(--red); }
@keyframes pulse { from { transform: scale(1); opacity: 0.6; } to { transform: scale(3.2); opacity: 0; } }

/* ---- scroll area: intro (empty state) + messages ---- */
.stage {
  flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding: 0 24px;
  scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent;
}
.intro {
  display: grid; grid-template-rows: 1fr; margin: auto 0; opacity: 1;
  transition: grid-template-rows 0.5s var(--ease-out), opacity 0.3s ease;
}
.intro-clip { min-height: 0; overflow: hidden; }
.intro-body { padding: 28px 0 20px; }
body.chatting .intro {
  grid-template-rows: 0fr; opacity: 0; visibility: hidden; margin: 0;
  transition: grid-template-rows 0.5s var(--ease-out), opacity 0.25s ease, visibility 0s 0.5s;
}

.mark { position: relative; display: block; width: 44px; height: 44px; margin-bottom: 22px; }
.mark i {
  position: absolute; inset: 0; border: 1.5px solid var(--blue); border-radius: 50%; opacity: 0;
  animation: ripple 3.2s cubic-bezier(0.2, 0.6, 0.3, 1) infinite;
}
.mark i:nth-child(2) { animation-delay: 1.07s; }
.mark i:nth-child(3) { animation-delay: 2.14s; }
.mark::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px;
  border-radius: 50%; background: var(--blue);
}
@keyframes ripple { from { transform: scale(0.25); opacity: 0.9; } to { transform: scale(1); opacity: 0; } }

h1 { margin: 0; font-size: clamp(26px, 6vw, 36px); line-height: 1.1; font-weight: 650; letter-spacing: -0.03em; text-wrap: balance; }
.lead { margin: 12px 0 0; font-size: 17px; max-width: 36ch; text-wrap: pretty; }
.how { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.label { margin: 0 0 8px; font-size: 11px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.starters { margin-top: 26px; }
.starter {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; min-height: 50px;
  margin-top: 6px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card);
  color: var(--fg); font: inherit; font-size: 15px; text-align: left; cursor: pointer;
  transition: background-color 0.2s ease, border-color 0.2s ease;
}
.starter:hover { background: var(--blue-soft); border-color: #bcd0f7; }
.starter .arr { flex: none; display: grid; color: var(--blue); transition: transform 0.3s var(--ease-out); }
.starter:hover .arr, .starter:focus-visible .arr { transform: translateX(4px); }

.intro-body > * { animation: rise 0.6s var(--ease-out) both; }
.intro-body > :nth-child(2) { animation-delay: 0.06s; }
.intro-body > :nth-child(3) { animation-delay: 0.12s; }
.intro-body > :nth-child(4) { animation-delay: 0.16s; }
.intro-body > :nth-child(5) { animation-delay: 0.22s; }

/* ---- messages ---- */
.chat { display: flex; flex-direction: column; gap: 26px; padding: 22px 0 24px; }
.msg { overflow-wrap: anywhere; animation: rise 0.32s var(--ease-out) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.msg p { margin: 0; font-size: 16px; line-height: 1.6; }
.msg.user {
  align-self: flex-end; max-width: 85%; padding: 10px 16px; border-radius: 16px 16px 4px 16px;
  background: var(--blue-soft); color: var(--fg);
}
.msg.bot { align-self: flex-start; max-width: 100%; }
.msg.error { padding-left: 12px; border-left: 3px solid var(--red); }

.msg.typing { display: flex; gap: 6px; align-items: center; height: 28px; }
.msg.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); animation: blink 1.2s ease-in-out infinite; }
.msg.typing i:nth-child(2) { animation-delay: 0.16s; }
.msg.typing i:nth-child(3) { animation-delay: 0.32s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: none; } 40% { opacity: 1; transform: translateY(-3px); } }

.meta { display: grid; gap: 10px; margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: #f8f9fc; font-size: 13px; color: var(--muted); }
.closest .k { display: block; margin-bottom: 2px; font-size: 11px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; }
.matched-q { color: var(--fg); font-size: 14px; }

/* match meter: green = strong, blue (dashed) = possible, red = no close match; the label always says which */
.conf { --c: var(--green); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.conf.medium { --c: var(--blue); }
.conf.low { --c: var(--red); }
.bar { position: relative; width: 112px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--c); transform: scaleX(0); transform-origin: left; transition: transform 0.9s var(--ease-out); }
.conf.go .bar span { transform: scaleX(var(--v, 0)); }
.conf.medium .bar span { background: repeating-linear-gradient(90deg, var(--c) 0 4px, transparent 4px 7px); }
.badge { display: inline-flex; align-items: center; gap: 6px; color: var(--fg); font-weight: 650; }
.badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.score { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--fg); }
.meta.nomatch { background: var(--red-soft); }

.related { margin-top: 18px; }
.msg .label { margin: 0 0 8px; font-size: 11px; line-height: 1.4; }   /* beats ".msg p" so the caption stays small */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 9px 14px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--card); color: var(--fg);
  font: inherit; font-size: 14px; line-height: 1.3; text-align: left; cursor: pointer;
  transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s var(--ease-out);
}
.chip:hover { background: var(--blue-soft); border-color: var(--blue); transform: translateY(-1px); }

/* ---- composer: a boxed input with the send button inside ---- */
.composer { padding: 14px 20px 20px; padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.field {
  display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; border: 1px solid var(--line-strong); border-radius: 14px;
  background: var(--card); transition: border-color 0.2s ease, box-shadow 0.25s ease;
}
.field:hover { border-color: #9db8ee; }
.field:focus-within { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.16); }
.field input { flex: 1; min-width: 0; height: 40px; padding: 0; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 16px; }
.field input::placeholder { color: var(--placeholder); }
.field input:focus { outline: none; }

.send {
  flex: none; width: 40px; height: 40px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 10px;
  background: var(--blue); color: #fff; cursor: pointer; transition: background-color 0.2s ease, opacity 0.2s ease;
}
.send:hover:not(:disabled) { background: var(--blue-dark); }
.send svg { transition: transform 0.3s var(--ease-out); }
.send:hover:not(:disabled) svg { transform: translateX(3px); }
.send:disabled { opacity: 0.4; cursor: not-allowed; }

@media (pointer: coarse) { .chip { min-height: 44px; } .send { width: 44px; height: 44px; } }
@media (max-width: 520px) {
  body { padding: 12px; }
  .card { border-radius: 16px; }
  .top, .stage { padding-left: 16px; padding-right: 16px; }
  .composer { padding-left: 12px; padding-right: 12px; }
  .msg.user { max-width: 92%; }
}

/* Respect the user's motion preference: no movement, final states shown immediately. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .card:hover, .chip:hover { transform: none; }
}

</style>

on":"Can you deliver to a boat or a ship?","answer":"We can deliver to a marina office or a harbour master's address if they agree to accept parcels, but we cannot deliver to a vessel at sea or to a moving boat. Use the 'Delivery instructions' box at checkout to add the berth number."},{"id":2,"category":"Delivery","question":"Do you ship to Antarctica?","answer":"Not at the moment. We currently ship to about 40 countries, and Antarctic research stations are not on the list. You can have the order sent to a friend or a forwarding agent in a supported country instead."},{"id":3,"category":"Delivery","question":"Can I get my order delivered to a PO box?","answer":"Yes for standard delivery in most countries. Express and same-day delivery need a street address because the courier must collect a signature."},{"id":4,"category":"Delivery","question":"What if I am not home when the courier comes?","answer":"The courier will try again the next business day and leave a card. After two failed attempts the parcel goes to a nearby pickup point for 7 days. You can also choose a safe place or a neighbour in the tracking page."},{"id":5,"category":"Delivery","question":"My dog ate my parcel. What can I do?","answer":"We are sorry to hear that, and glad the dog is fine! If the courier marked the parcel as delivered, we cannot replace it, but you can contact support with a photo and we will see what we can do as a one-time courtesy."},{"id":6,"category":"Delivery","question":"Can I send a package directly to a friend as a surprise?","answer":"Yes. Enter your friend's address as the shipping address and tick 'This is a gift'. The invoice and prices are left out, and you can add a handwritten-style gift message."},{"id":7,"category":"Delivery","question":"Will the parcel show what is inside?","answer":"No. All parcels arrive in plain, unbranded packaging with only a return address, so the contents stay private."},{"id":8,"category":"Delivery","question":"Do you deliver on Sundays and public holidays?","answer":"Sunday delivery is available in selected cities with express shipping. Public holidays are not delivery days, so those orders arrive on the next working day."},{"id":9,"category":"Delivery","question":"Can I collect my order from your warehouse myself?","answer":"We do not have a collection point at the warehouse. You can pick up from a partner locker or pickup point by choosing 'Pickup point' at checkout."},{"id":10,"category":"Delivery","question":"What happens if a hurricane or a snowstorm delays my delivery?","answer":"Severe weather can pause couriers for a few days. Your tracking page will show a weather delay, no extra action is needed, and the order will be delivered as soon as roads and flights reopen."},{"id":11,"category":"Delivery","question":"A parcel addressed to someone else arrived at my house. What should I do?","answer":"Please do not open it. Write 'Return to sender' on it and hand it back to the courier, or contact us with the order number on the label and we will arrange a free collection."},{"id":12,"category":"Delivery","question":"What happens if the courier loses my package?","answer":"If the courier loses your order we will send a replacement or a full refund, whichever you prefer. You do not have to wait for the courier's investigation to finish."},{"id":13,"category":"Orders","question":"I lost my tracking number. How do I find it?","answer":"Sign in and open 'My Orders'. The tracking number is shown on each shipped order, and it was also sent in your shipping confirmation email. Guest customers can look it up with their order number and email address."},{"id":14,"category":"Orders","question":"I checked out as a guest. How can I follow my parcel?","answer":"No account is needed. Use the 'Guest lookup' link in the page footer and enter the reference from your confirmation email together with the email address you used at checkout."},{"id":15,"category":"Orders","question":"My name is spelled wrong on the order. Can you fix it?","answer":"Yes, as long as the order has not shipped. Contact support with your order number and the correct spelling, and we will update it before dispatch."},{"id":16,"category":"Orders","question":"The item I ordered was discontinued. What happens now?","answer":"If we cannot fulfil an item after you order it, we will email you within one business day with a similar alternative or a full refund. You are never charged for an item we cannot send."},{"id":17,"category":"Orders","question":"Can I order by phone or by WhatsApp?","answer":"Phone orders are accepted on 1-800-555-0199 during support hours. We do not take orders through WhatsApp or social media messages for security reasons."},{"id":18,"category":"Returns","question":"Can I return something I have already used or worn?","answer":"Used items cannot be returned for a change of mind. If it is faulty, damaged or not as described, you can return it at any time within the warranty period regardless of use."},{"id":19,"category":"Returns","question":"Can I return a gift without a receipt?","answer":"Yes. The giver's name and price are never shown. Ask for a gift return in your account or contact support with the order number, and you will receive store credit instead of a cash refund."},{"id":20,"category":"Returns","question":"Can I return an item that I bought on sale?","answer":"Yes, sale items follow the same 30-day return policy. Items marked 'Final sale' are the only exception and cannot be returned."},{"id":21,"category":"Returns","question":"Do you take back old products for recycling?","answer":"Yes. Request a free recycling label from the 'Returns' page. We recycle old electronics and packaging, and you receive a 10% voucher for your next order."},{"id":22,"category":"Payments","question":"Can I pay with Bitcoin or other cryptocurrency?","answer":"Not at the moment. We only accept cards, PayPal, Apple Pay, Google Pay and gift cards."},{"id":23,"category":"Payments","question":"Do you offer cash on delivery?","answer":"No, we do not offer cash on delivery. All orders are paid online at checkout."},{"id":24,"category":"Payments","question":"Why is the price in my cart different from the product page?","answer":"Prices can change when you select a size or color, when a sale ends, or when your delivery country adds taxes. The cart always shows the final price before you pay."},{"id":25,"category":"Payments","question":"Do you price match if I find it cheaper elsewhere?","answer":"Yes. If an identical item is in stock at a lower price from another authorised retailer, contact support within 14 days of buying with a link and we will refund the difference."},{"id":26,"category":"Payments","question":"Can I get an invoice with my company name and VAT number?","answer":"Yes. Add your company details at checkout or in 'Account settings' > 'Billing', and download the invoice from 'My Orders' once the order ships."},{"id":27,"category":"Payments","question":"Can I pay in a different currency?","answer":"Prices can be shown in several currencies using the selector at the top of the page. Your bank may add a small conversion fee, which we do not control."},{"id":28,"category":"Gift cards","question":"Do gift cards expire?","answer":"No. Our gift cards never expire and carry no fees."},{"id":29,"category":"Gift cards","question":"Can I use a gift card to buy another gift card?","answer":"No, gift cards cannot be used to purchase other gift cards. They can be used for any regular product and for shipping."},{"id":30,"category":"Account","question":"Can I use a nickname instead of my real name on my account?","answer":"You can set a display name in 'Account settings' > 'Profile'. Your legal name is only required for payments and deliveries."},{"id":31,"category":"Account","question":"Do you sell my personal data to other companies?","answer":"No. We never sell personal data. We only share what is needed with payment processors and couriers to complete your order <script>
// Browser/Node port of the Python matcher: backend/normalizer.py (stop-words -> lemmatise -> Porter stem) followed by
// scikit-learn's TfidfVectorizer.transform (unigrams, sublinear TF, L2 norm) and cosine similarity.
// tests/test_standalone.py checks that this gives the same tokens, scores and answers as the Python code.
(function (root) {
  // ---- Porter stemmer (regex formulation); mirrors normalizer.stem() ----
  const STEP2 = {
    ational: "ate", tional: "tion", enci: "ence", anci: "ance", izer: "ize", bli: "ble", alli: "al",
    entli: "ent", eli: "e", ousli: "ous", ization: "ize", ation: "ate", ator: "ate", alism: "al",
    iveness: "ive", fulness: "ful", ousness: "ous", aliti: "al", iviti: "ive", biliti: "ble", logi: "log",
  };
  const STEP3 = { icate: "ic", ative: "", alize: "al", iciti: "ic", ical: "ic", ful: "", ness: "" };
  const c = "[^aeiou]", v = "[aeiouy]", C = c + "[^aeiouy]*", V = v + "[aeiou]*";
  const MGR0 = new RegExp("^(" + C + ")?" + V + C);
  const MEQ1 = new RegExp("^(" + C + ")?" + V + C + "(" + V + ")?$");
  const MGR1 = new RegExp("^(" + C + ")?" + V + C + V + C);
  const S_V = new RegExp("^(" + C + ")?" + v);
  const CVC = new RegExp("^" + C + v + "[^aeiouwxy]$");
  const DOUBLE = /([^aeiouylsz])\1$/;
  const STEP2_RE = new RegExp("^(.+?)(" + Object.keys(STEP2).join("|") + ")$");
  const STEP3_RE = new RegExp("^(.+?)(" + Object.keys(STEP3).join("|") + ")$");
  const STEP4_RE = /^(.+?)(al|ance|ence|er|ic|able|ible|ant|ement|ment|ent|ou|ism|ate|iti|ous|ive|ize)$/;
  const STEP4_ION_RE = /^(.+?)(s|t)(ion)$/;

  function stem(w) {
    if (w.length < 3 || !/^[a-z]+$/.test(w)) return w;
    const first = w[0];
    if (first === "y") w = "Y" + w.slice(1);
    let m;

    // step 1a
    if ((m = /^(.+?)(ss|i)es$/.exec(w))) w = m[1] + m[2];
    else if ((m = /^(.+?)([^s])s$/.exec(w))) w = m[1] + m[2];

    // step 1b
    if ((m = /^(.+?)eed$/.exec(w))) {
      if (MGR0.test(m[1])) w = w.slice(0, -1);
    } else if ((m = /^(.+?)(ed|ing)$/.exec(w)) && S_V.test(m[1])) {
      w = m[1];
      if (/(at|bl|iz)$/.test(w)) w += "e";
      else if (DOUBLE.test(w)) w = w.slice(0, -1);
      else if (CVC.test(w)) w += "e";
    }

    // step 1c
    if ((m = /^(.+?)y$/.exec(w)) && S_V.test(m[1])) w = m[1] + "i";

    // step 2
    if ((m = STEP2_RE.exec(w)) && MGR0.test(m[1])) w = m[1] + STEP2[m[2]];

    // step 3
    if ((m = STEP3_RE.exec(w)) && MGR0.test(m[1])) w = m[1] + STEP3[m[2]];

    // step 4
    if ((m = STEP4_RE.exec(w))) {
      if (MGR1.test(m[1])) w = m[1];
    } else if ((m = STEP4_ION_RE.exec(w)) && MGR1.test(m[1] + m[2])) {
      w = m[1] + m[2];
    }

    // step 5
    if ((m = /^(.+?)e$/.exec(w))) {
      const s = m[1];
      if (MGR1.test(s) || (MEQ1.test(s) && !CVC.test(s))) w = s;
    }
    if (/ll$/.test(w) && MGR1.test(w)) w = w.slice(0, -1);

    return first === "y" ? "y" + w.slice(1) : w;
  }

  function stripAccents(s) {
    return s.normalize("NFKD").replace(/[̀-ͯ]/g, "");
  }

  function create(model) {
    const vocab = new Map(model.vocabulary.map((term, i) => [term, i]));
    const stop = new Set(model.stop_words);
    const lemmas = new Map(Object.entries(model.lemmas));
    const rows = model.rows; // rows[f] = [[termIndex, weight], ...], already L2-normalised

    // Same as normalizer.tokens(): lower-case, strip accents, drop apostrophes, stop-words, lemmatise, stem.
    function tokens(text) {
      const cleaned = stripAccents(String(text).toLowerCase()).replace(/['’]/g, "");
      const out = [];
      for (const tok of cleaned.match(/[\p{L}\p{N}_]{2,}/gu) || []) {
        const lemma = lemmas.has(tok) ? lemmas.get(tok) : tok;
        if (stop.has(tok) || stop.has(lemma)) continue;
        out.push(stem(lemma));
      }
      return out;
    }

    // text -> Map(termIndex -> tf-idf weight), L2-normalised (same as TfidfVectorizer.transform)
    function transform(text) {
      const counts = new Map();
      for (const t of tokens(text)) {
        const idx = vocab.get(t);
        if (idx !== undefined) counts.set(idx, (counts.get(idx) || 0) + 1);
      }
      const vec = new Map();
      let norm = 0;
      for (const [idx, n] of counts) {
        const w = (1 + Math.log(n)) * model.idf[idx];
        vec.set(idx, w);
        norm += w * w;
      }
      norm = Math.sqrt(norm);
      if (norm > 0) for (const [idx, w] of vec) vec.set(idx, w / norm);
      return vec;
    }

    // Cosine similarity of the query with every FAQ, best first.
    function match(query, topK) {
      const q = transform(query);
      const scores = rows.map((row, f) => {
        let dot = 0;
        for (const [idx, w] of row) {
          const qw = q.get(idx);
          if (qw !== undefined) dot += qw * w;
        }
        return { index: f, score: Math.min(1, Math.max(0, dot)) };
      });
      scores.sort((a, b) => b.score - a.score || a.index - b.index);
      return scores.slice(0, topK).map((s) => ({ ...model.faqs[s.index], score: Math.round(s.score * 1e4) / 1e4 }));
    }

    return { tokens, transform, match };
  }

  root.FAQMatcher = { create, stem };
  if (typeof module !== "undefined") module.exports = root.FAQMatcher;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
// In-browser stand-in for the Flask API (same routes, same JSON), so frontend/app.js runs unchanged
// on a page with no server. Mirrors backend/app.py.
(function (root) {
  const Matcher = root.FAQMatcher || require("./tfidf.js");

  function createLocalApi(model) {
    const matcher = Matcher.create(model);
    const S = model.settings;

    const confidenceLabel = (score) =>
      score >= S.confident_threshold ? "high" : score >= S.reject_threshold ? "medium" : "low";
    const brief = (r) => ({ id: r.id, question: r.question, category: r.category, score: r.score });

    return async function api(path, options) {
      options = options || {};
      const url = path.split("?")[0];

      if (url === "/api/health") {
        return { status: "ok", engine: "browser", faq_count: model.faqs.length,
                 vocabulary_size: model.vocabulary.length, trained_at: model.trained_at };
      }
      if (url === "/api/faqs") {
        return { faqs: model.faqs.map((f) => ({ id: f.id, category: f.category, question: f.question })) };
      }
      const byId = url.match(/^\/api\/faqs\/(\d+)$/);
      if (byId) {
        const f = model.faqs.find((x) => x.id === Number(byId[1]));
        if (!f) throw new Error("FAQ not found");
        return f;
      }
      if (url === "/api/ask" && options.method === "POST") {
        let body;
        try { body = JSON.parse(options.body); } catch (e) { throw new Error("Request body must be JSON"); }
        if (body === null || typeof body !== "object" || Array.isArray(body)) throw new Error("Request body must be JSON");
        if (typeof body.question !== "string" || !body.question.trim()) throw new Error("'question' must be a non-empty string");
        const question = body.question.trim();
        if (question.length > S.max_question_len) throw new Error(`'question' must be at most ${S.max_question_len} characters`);
        const topK = body.top_k === undefined ? 3 : body.top_k;
        if (!Number.isInteger(topK) || topK < 1 || topK > 10) throw new Error("'top_k' must be an integer between 1 and 10");

        const results = matcher.match(question, topK);
        const best = results[0];
        const confidence = confidenceLabel(best.score);
        const matched = confidence !== "low";
        const candidates = matched ? results.slice(1) : results;
        const floor = matched ? Math.max(S.min_suggestion_score_matched, S.suggestion_relative * best.score)
                              : S.min_suggestion_score;
        const suggestions = candidates.filter((r) => r.score >= floor).map(brief);
        const answer = matched ? best.answer
          : suggestions.length ? S.fallback_with_suggestions : S.fallback_no_suggestions;
        return { matched, confidence, answer, match: matched ? brief(best) : null, suggestions };
      }
      throw new Error("Not found");
    };
  }

  root.createLocalApi = createLocalApi;
  if (typeof module !== "undefined") module.exports = createLocalApi;
})(typeof window !== "undefined" ? window : globalThis);

</script>

<script>
// If the frontend is hosted separately from the Flask API, set window.API_BASE
// (e.g. via ?api=http://127.0.0.1:5000) — otherwise it uses the same origin.
const API_BASE = (new URLSearchParams(location.search).get("api") || window.API_BASE || "").replace(/\/$/, "");

const stage = document.getElementById("stage");
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");
const statusText = document.getElementById("status-text");
const startersEl = document.getElementById("starters");

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
// Static markup (no user data), so setting innerHTML is safe here.
const ARROW = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">' +
  '<path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;   // textContent => no HTML injection
  return node;
}

function scrollDown() {
  stage.scrollTo({ top: stage.scrollHeight, behavior: reduceMotion.matches ? "auto" : "smooth" });
}

// The first message tucks the intro away so the conversation gets the whole screen.
function startChat() { document.body.classList.add("chatting"); }

function addUser(text) {
  startChat();
  chat.appendChild(el("div", "msg user", text));
  scrollDown();
}

function addBot(text, extras, kind) {      // kind: "error" adds a red edge
  startChat();
  const box = el("div", kind ? `msg bot ${kind}` : "msg bot");
  box.appendChild(el("p", null, text));
  if (extras) extras(box);
  chat.appendChild(box);
  scrollDown();
  return box;
}

// Three softly pulsing dots while the answer is being looked up.
function addTyping() {
  startChat();
  const box = el("div", "msg bot typing");
  box.setAttribute("role", "status");
  box.setAttribute("aria-label", "Searching FAQs");
  for (let i = 0; i < 3; i++) box.appendChild(el("i"));
  chat.appendChild(box);
  scrollDown();
  return box;
}

// Count the similarity number up from 0 while the bar fills.
function animateScore(node, target) {
  if (reduceMotion.matches) { node.textContent = target.toFixed(2); return; }
  const start = performance.now(), duration = 800;
  node.textContent = "0.00";
  const tick = (now) => {
    const t = Math.min(1, (now - start) / duration);
    node.textContent = (target * (1 - Math.pow(1 - t, 3))).toFixed(2);
    if (t < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function confidenceMeta(box, data) {
  const meta = el("div", "meta");
  if (data.match) {
    const closest = el("div", "closest");
    closest.append(el("span", "k", "Closest FAQ"), el("span", "matched-q", data.match.question));
    meta.appendChild(closest);

    const conf = el("div", `conf ${data.confidence}`);
    const bar = el("div", "bar");
    const fill = el("span");
    fill.style.setProperty("--v", Math.min(1, data.match.score * 1.6));   // stretch for visibility
    bar.appendChild(fill);
    // The score is word overlap with the FAQ, not a guarantee that the FAQ answers the question.
    const label = data.confidence === "high" ? "Strong match" : "Possible match";
    const sim = el("span", "sim", "word similarity ");
    const score = el("span", "score", data.match.score.toFixed(2));
    sim.appendChild(score);
    conf.append(bar, el("span", "badge", label), sim);
    meta.appendChild(conf);

    // Start the fill and the count-up on the next painted frame so the transition runs.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      conf.classList.add("go");
      animateScore(score, data.match.score);
    }));
  }
  box.appendChild(meta);
}

// Shown when nothing matched closely enough: a red dot plus text, so it never relies on colour alone.
function noMatchMeta(box) {
  const meta = el("div", "meta nomatch");
  const conf = el("div", "conf low go");
  conf.appendChild(el("span", "badge", "No close match"));
  meta.appendChild(conf);
  box.appendChild(meta);
}

function suggestionChips(box, suggestions, title) {
  if (!suggestions.length) return;
  const wrap = el("div", "related");
  wrap.appendChild(el("p", "label", title));
  const chips = el("div", "chips");
  suggestions.forEach((s) => {
    const chip = el("button", "chip", s.question);
    chip.type = "button";
    chip.addEventListener("click", () => showFaq(s));
    chips.appendChild(chip);
  });
  wrap.appendChild(chips);
  box.appendChild(wrap);
}

async function api(path, options) {
  if (window.LOCAL_API) return window.LOCAL_API(path, options);   // standalone page: no server
  const res = await fetch(API_BASE + path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

async function showFaq(s) {
  addUser(s.question);
  try {
    const faq = await api(`/api/faqs/${s.id}`);
    addBot(faq.answer);
  } catch (err) {
    addBot(`Something went wrong: ${err.message}`, null, "error");
  }
}

async function ask(question) {
  addUser(question);
  const typing = addTyping();
  sendBtn.disabled = true;
  try {
    const data = await api("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, top_k: 4 }),
    });
    typing.remove();
    addBot(data.answer, (box) => {
      if (data.matched) confidenceMeta(box, data);
      else noMatchMeta(box);
      suggestionChips(
        box,
        data.suggestions,
        data.matched ? "Not what you meant? Try:" : "Did you mean…"
      );
    });
  } catch (err) {
    typing.remove();
    addBot(`Couldn't reach the FAQ service: ${err.message}`, null, "error");
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  input.value = "";
  ask(q);
});

async function init() {
  try {
    const [health, faqs] = await Promise.all([api("/api/health"), api("/api/faqs")]);
    statusText.textContent = `${health.faq_count} FAQs loaded`;
    statusEl.className = "status ok";
    // A few example questions: one per category, up to 4, kept short and calm.
    const seen = new Set();
    faqs.faqs.forEach((f) => {
      if (seen.size >= 4 || seen.has(f.category)) return;
      seen.add(f.category);
      const row = el("button", "starter");
      row.type = "button";
      row.append(el("span", null, f.question));
      const arrow = el("span", "arr");
      arrow.innerHTML = ARROW;
      row.appendChild(arrow);
      row.addEventListener("click", () => ask(f.question));
      startersEl.appendChild(row);
    });
  } catch (err) {
    statusText.textContent = "backend offline";
    statusEl.className = "status err";
    addBot("I can't reach the backend right now. Start it with `python backend/app.py` and refresh.", null, "error");
  }
}
init();

</script>
